[project]
name = "rit"
version = "0.1.0"
description = "Terminal GitHub PR Review CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
  "click>=8.5.1",
  "gitpython>=3.2.1",
  "markdown-it-py>=4.2.0",
  "pillow>=13.0.0",
  "pydantic>=2.14.3",
  "pyperclip>=1.11.0",
  "rich>=15.0.0",
  "textual>=8.2.8",
  "textual-image[textual]>=0.14.2",
  "unidiff>=1.0.1",
]

[project.scripts]
rit = "rit.cli:main"

[build-system]
requires = ["maturin>=1.16.0,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "rit._lumis"
features = ["extension-module"]

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.1.post1",
  "pytest-xdist>=3.8.0",
  "textual-dev>=1.8.0",
  "ty>=0.0.100",
]

[tool.pytest.ini_options]
addopts = ["-n", "auto", "--dist", "worksteal"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.pyright]
pythonVersion = "3.15"
typeCheckingMode = "basic"

include = ["src/rit", "tests"]
exclude = ["**/__pycache__/**", "**/site-packages/**"]

venvPath = "."
venv = ".venv"

defineConstant = { DEBUG = true }

reportMissingImports = "error"
reportMissingTypeStubs = false
reportGeneralTypeIssues = "warning"
reportAttributeAccessIssue = "warning"
