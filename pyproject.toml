[project]
name = "rit"
version = "0.1.0"
description = "Terminal GitHub PR Review CLI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "click>=8.4.2",
  "gitpython>=3.1.59",
  "markdown-it-py>=4.2.0",
  "pillow>=12.3.0",
  "pydantic>=2.13.4",
  "pyperclip>=1.11.0",
  "rich>=15.0.0",
  "textual>=8.2.8",
  "textual-image[textual]>=0.13.2",
  "unidiff>=1.0.0",
]

[project.scripts]
rit = "rit.cli:main"

[build-system]
requires = ["maturin>=1.14.1,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "rit._lumis"
features = ["extension-module"]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-xdist>=3.8.0",
  "textual-dev>=1.8.0",
  "ty>=0.0.70",
]

[tool.pytest.ini_options]
addopts = ["-n", "auto", "--dist", "worksteal"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"

include = ["src/rit", "tests"]
exclude = ["**/__pycache__/**", "**/site-packages/**"]

venvPath = "."
venv = ".venv"

defineConstant = { DEBUG = true }

reportMissingImports = "error"
reportMissingTypeStubs = false
reportGeneralTypeIssues = "warning"
reportAttributeAccessIssue = "warning"
