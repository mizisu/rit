[package]
name = "rit-lumis"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
publish = false

[lib]
name = "_lumis"
crate-type = ["cdylib"]

[dependencies]
lumis = "0.19.4"
pyo3 = "0.30.1"

[features]
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = true
codegen-units = 1
# Avoid malformed Mach-O LINKEDIT tables on macOS (rust-lang/rust#157750).
strip = false
