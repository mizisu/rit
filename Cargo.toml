[package]
name = "rit-lumis"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false

[lib]
name = "_lumis"
crate-type = ["cdylib"]

[dependencies]
lumis = "0.12.0"
pyo3 = "0.29.0"

[features]
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = true
codegen-units = 1
strip = true
